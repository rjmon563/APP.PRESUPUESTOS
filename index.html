<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresuPro V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        .hidden { display: none !important; }
        .active-scale:active { transform: scale(0.95); }
        /* Estilo para que el textarea de notas no tenga bordes feos */
        textarea { resize: none; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="header-app"></div>

    <div id="main-container" class="max-w-md mx-auto pb-24">

        <div id="pantalla-clientes" class="p-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black italic uppercase text-slate-800">Clientes</h2>
                <button onclick="nuevoCliente()" class="bg-blue-600 text-white w-12 h-12 rounded-full font-bold text-2xl shadow-lg active-scale">+</button>
            </div>
            <div id="lista-clientes" class="space-y-3">
                </div>
            
            <div class="grid grid-cols-2 gap-4 mt-10">
                <button onclick="irAPantalla('calendario')" class="bg-white p-4 rounded-2xl border text-center font-bold text-[10px] uppercase italic active-scale shadow-sm">📅 Agenda</button>
                <button onclick="irAPantalla('ajustes')" class="bg-white p-4 rounded-2xl border text-center font-bold text-[10px] uppercase italic active-scale shadow-sm">⚙️ Ajustes</button>
            </div>
        </div>

        <div id="pantalla-nuevo-cliente" class="p-6 hidden">
            <h2 class="text-xl font-black italic uppercase mb-6">Nuevo Expediente</h2>
            <div class="space-y-4">
                <input type="text" id="cli-nombre" placeholder="NOMBRE COMPLETO" class="w-full p-4 rounded-2xl border-none shadow-inner bg-white font-bold uppercase">
                <input type="text" id="cli-cif" placeholder="CIF / DNI" class="w-full p-4 rounded-2xl border-none shadow-inner bg-white font-bold uppercase">
                <input type="text" id="cli-tel" placeholder="TELÉFONO" class="w-full p-4 rounded-2xl border-none shadow-inner bg-white font-bold">
                <input type="text" id="cli-dir" placeholder="DIRECCIÓN" class="w-full p-4 rounded-2xl border-none shadow-inner bg-white font-bold uppercase">
                <div class="flex gap-2">
                    <input type="text" id="cli-cp" placeholder="C.P." class="w-1/3 p-4 rounded-2xl border-none shadow-inner bg-white font-bold">
                    <button onclick="guardarDatosCliente()" class="w-2/3 bg-blue-600 text-white font-black rounded-2xl p-4 uppercase italic active-scale shadow-lg">Crear Cliente</button>
                </div>
                <button onclick="irAPantalla('clientes')" class="w-full text-center text-xs font-bold opacity-40 uppercase py-4">Cancelar</button>
            </div>
        </div>

        <div id="pantalla-expediente" class="p-4 hidden">
            <button onclick="irAPantalla('clientes')" class="mb-4 text-xs font-bold opacity-40 uppercase italic">← Volver</button>
            <div id="ficha-cliente-detalle">
                </div>
            <div class="mt-8">
                <h3 class="font-black italic uppercase text-sm mb-4">Nueva Obra</h3>
                <input type="text" id="input-nombre-obra" placeholder="NOMBRE DE LA OBRA (EJ: SALÓN)" class="w-full p-4 rounded-2xl border shadow-sm mb-3 font-bold uppercase text-sm">
                <button onclick="confirmarNombreObra()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black uppercase italic active-scale shadow-lg">Iniciar Medición</button>
            </div>
        </div>

        <div id="pantalla-trabajo" class="p-4 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 id="titulo-obra-actual" class="text-lg font-black italic uppercase text-blue-700">OBRA</h2>
                <input type="date" id="fecha-obra" class="text-[10px] font-bold border-none bg-transparent">
            </div>

            <div id="botones-trabajo" class="grid grid-cols-3 gap-2 mb-6">
                </div>

            <div id="lista-medidas-obra" class="space-y-2">
                </div>

            <div class="flex gap-2 mt-6 mb-20">
                <button id="btn-iva-21" onclick="cambiarIVA(21)" class="iva-btn flex-1 p-3 rounded-xl font-black text-[10px] bg-blue-600 text-white">IVA 21%</button>
                <button id="btn-iva-10" onclick="cambiarIVA(10)" class="iva-btn flex-1 p-3 rounded-xl font-black text-[10px] bg-slate-100">IVA 10%</button>
                <button onclick="guardarObraCompleta()" class="flex-[2] bg-green-500 text-white p-3 rounded-xl font-black text-[10px] uppercase italic active-scale shadow-lg">Finalizar y Enviar PDF</button>
            </div>
        </div>

        <div id="pantalla-calendario" class="p-4 hidden text-center">
            <div class="flex justify-between items-center mb-6">
                <button onclick="cambiarMes(-1)" class="p-4 font-bold text-xl">←</button>
                <h2 id="mes-actual" class="text-lg font-black uppercase italic"></h2>
                <button onclick="cambiarMes(1)" class="p-4 font-bold text-xl">→</button>
            </div>
            <div id="calendario-grid" class="grid grid-cols-7 gap-1"></div>
            
            <div id="detalle-dia" class="mt-6 p-4 bg-white rounded-[30px] border hidden text-left">
                <p id="fecha-seleccionada" class="text-[9px] font-black opacity-40 uppercase mb-2"></p>
                <textarea id="note-dia" class="w-full h-24 border-none font-bold text-sm outline-none" placeholder="Escribe los tajos o notas aquí..."></textarea>
                <button onclick="guardarEventoDia()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold text-xs uppercase mt-2 active-scale">Guardar en Agenda</button>
            </div>
            <button onclick="irAPantalla('clientes')" class="mt-10 text-xs font-bold opacity-30 uppercase italic">Volver al inicio</button>
        </div>

        <div id="pantalla-ajustes" class="p-6 hidden">
            <h2 class="text-xl font-black italic uppercase mb-6">Configuración</h2>
            <div class="space-y-3">
                <input type="text" id="config-nombre" placeholder="TU NOMBRE / EMPRESA" class="w-full p-4 rounded-xl border bg-white font-bold uppercase">
                <input type="text" id="config-cif" placeholder="TU CIF / DNI" class="w-full p-4 rounded-xl border bg-white font-bold uppercase">
                <input type="text" id="config-tel" placeholder="TELÉFONO" class="w-full p-4 rounded-xl border bg-white font-bold">
                <input type="text" id="config-dir" placeholder="DIRECCIÓN" class="w-full p-4 rounded-xl border bg-white font-bold uppercase">
                <input type="text" id="config-ciudad" placeholder="CIUDAD" class="w-full p-4 rounded-xl border bg-white font-bold uppercase">
                <input type="number" id="config-nPresu" placeholder="PRÓXIMO Nº PRESUPUESTO" class="w-full p-4 rounded-xl border bg-white font-bold">
                
                <button onclick="guardarAjustes()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase italic active-scale shadow-lg">Guardar Ajustes</button>
                
                <div class="pt-6 border-t mt-6">
                    <p class="text-[9px] font-black opacity-40 uppercase mb-4 tracking-widest text-center">Resumen Fiscal Acumulado</p>
                    <div id="resumen-iva-lista" class="space-y-2 bg-white p-4 rounded-2xl border"></div>
                </div>

                <div class="flex gap-2 mt-4">
                    <button onclick="exportarDatos()" class="flex-1 bg-slate-100 p-3 rounded-xl text-[9px] font-black uppercase">Copia Seguridad</button>
                    <label class="flex-1 bg-slate-100 p-3 rounded-xl text-[9px] font-black uppercase text-center cursor-pointer">
                        Importar <input type="file" class="hidden" onchange="importarDatos(event)">
                    </label>
                </div>
            </div>
        </div>

    </div>

    <div id="modal-calc" class="fixed inset-0 bg-slate-900/90 flex items-end justify-center z-50 hidden">
        <div class="bg-white w-full rounded-t-[40px] p-6 animate-slide-up">
            <div class="flex justify-between items-center mb-4">
                <h3 id="calc-titulo" class="font-black italic uppercase text-sm text-blue-600">MEDIDA</h3>
                <button onclick="cerrarCalc()" class="text-slate-300 font-bold">CERRAR</button>
            </div>
            
            <div id="calc-display" class="bg-slate-100 p-8 rounded-[30px] text-right text-4xl font-black text-slate-800 mb-6 min-h-[120px] flex flex-col justify-end">
                0
            </div>

            <div class="grid grid-cols-4 gap-3">
                <button onclick="teclear('7')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">7</button>
                <button onclick="teclear('8')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">8</button>
                <button onclick="teclear('9')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">9</button>
                <button onclick="teclear('DEL')" class="bg-red-50 text-red-500 h-16 rounded-2xl font-bold text-xs active-scale">DEL</button>
                
                <button onclick="teclear('4')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">4</button>
                <button onclick="teclear('5')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">5</button>
                <button onclick="teclear('6')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">6</button>
                <button onclick="teclear('+')" class="bg-blue-50 text-blue-600 h-16 rounded-2xl font-bold text-2xl active-scale">+</button>
                
                <button onclick="teclear('1')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">1</button>
                <button onclick="teclear('2')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">2</button>
                <button onclick="teclear('3')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">3</button>
                <button onclick="teclear('.')" class="bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">,</button>
                
                <button onclick="teclear('0')" class="col-span-2 bg-slate-50 h-16 rounded-2xl font-bold text-xl active-scale">0</button>
                <button onclick="teclear('OK')" class="col-span-2 bg-green-500 text-white h-16 rounded-2xl font-black text-xl active-scale">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
