<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Presupuestos | Panel de Control</title>
    <style>
        /* Estilos base para asegurar que la estructura no se rompa */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
        }

        /* Contenedor principal donde se inyectará la App */
        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Estilo para el contenido dinámico (lo que ya tenías funcionando) */
        #main-content {
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Botones de la cabecera (mejorados visualmente pero con la misma función) */
        .header-btn {
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .header-btn:hover {
            transform: translateY(-1px);
            filter: brightness(95%);
        }

        .header-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="app">
        <div style="text-align: center; padding: 50px; color: #666;">
            Cargando sistema de presupuestos...
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
