<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PresuPro</title>
    <meta name="presupro-version" content="5">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b3a6e">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Clientes -->
    <div id="pantalla-clientes" class="screen">
        <header class="appbar">
            <h1 class="brand">Presu<span>Pro</span></h1>
            <div class="appbar-actions">
                <button class="icon-btn" aria-label="Agenda de obra" onclick="irAPantalla('calendario')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
                </button>
                <button class="icon-btn" aria-label="Mis datos y copia de seguridad" onclick="irAPantalla('ajustes')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                </button>
            </div>
        </header>
        <div class="ruler" aria-hidden="true"></div>
        <div id="aviso-copia"></div>
        <div id="lista-clientes"></div>
        <button class="fab" onclick="nuevoCliente()" aria-label="Nuevo cliente">+</button>
    </div>

    <!-- Agenda -->
    <div id="pantalla-calendario" class="hidden screen screen-pad">
        <button class="back" onclick="irAPantalla('clientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Volver</button>
        <h2 class="h-screen">Agenda de obra</h2>
        <div class="cal-nav">
            <button onclick="cambiarMes(-1)" aria-label="Mes anterior">◀</button>
            <div id="mes-actual">Mes</div>
            <button onclick="cambiarMes(1)" aria-label="Mes siguiente">▶</button>
        </div>
        <div id="calendario-grid"></div>
        <div id="detalle-dia" class="day-detail hidden">
            <p id="fecha-seleccionada"></p>
            <textarea id="nota-dia" placeholder="¿Qué hay que hacer ese día?" oninput="guardarEventoDia()"></textarea>
        </div>
    </div>

    <!-- Nuevo cliente -->
    <div id="pantalla-nuevo-cliente" class="hidden screen screen-pad">
        <button class="back" onclick="irAPantalla('clientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Volver</button>
        <h2 class="h-screen">Nuevo cliente</h2>
        <label class="field"><span>Nombre del cliente</span><input id="cli-nombre" type="text" autocomplete="off"></label>
        <label class="field"><span>CIF / NIF</span><input id="cli-cif" type="text" autocomplete="off"></label>
        <label class="field"><span>Teléfono</span><input id="cli-tel" type="tel" autocomplete="off"></label>
        <label class="field"><span>Dirección</span><input id="cli-dir" type="text" autocomplete="off"></label>
        <label class="field"><span>Código postal</span><input id="cli-cp" type="text" inputmode="numeric" autocomplete="off"></label>
        <button class="btn btn-primary" onclick="guardarDatosCliente()">Guardar cliente</button>
    </div>

    <!-- Mis datos -->
    <div id="pantalla-ajustes" class="hidden screen screen-pad">
        <button class="back" onclick="irAPantalla('clientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Volver</button>
        <h2 class="h-screen">Mis datos fiscales</h2>
        <label class="field"><span>Tu nombre o empresa</span><input id="config-nombre" type="text"></label>
        <label class="field"><span>Tu CIF</span><input id="config-cif" type="text"></label>
        <label class="field"><span>Teléfono</span><input id="config-tel" type="tel"></label>
        <label class="field"><span>Email</span><input id="config-email" type="email"></label>
        <label class="field"><span>Dirección</span><input id="config-dir" type="text"></label>
        <div class="row2">
            <label class="field"><span>CP</span><input id="config-cp" type="text" inputmode="numeric"></label>
            <label class="field"><span>Ciudad</span><input id="config-ciudad" type="text"></label>
        </div>
        <label class="field"><span>Siguiente nº de presupuesto</span><input id="config-nPresu" type="number" inputmode="numeric"></label>
        <label class="field"><span>Condiciones (salen al pie del PDF)</span><textarea id="config-condiciones" rows="4"></textarea></label>
        <button class="btn btn-primary" onclick="guardarAjustes()">Guardar configuración</button>

        <div class="group">
            <h3>Resumen de presupuestos</h3>
            <div id="resumen-iva-lista"></div>
        </div>

        <div class="group">
            <h3>Copia de seguridad</h3>
            <div class="two-btn">
                <button class="btn btn-light" onclick="exportarDatos()">Exportar</button>
                <button class="btn btn-light" onclick="document.getElementById('import-file').click()">Importar</button>
            </div>
            <p id="info-copia" class="small center"></p>
            <p id="version" class="small center"></p>
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importarDatos(event)">
        </div>
    </div>

    <!-- Ficha del cliente -->
    <div id="pantalla-expediente" class="hidden screen screen-pad">
        <button class="back" onclick="irAPantalla('clientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Clientes</button>
        <div id="ficha-cliente-detalle"></div>
        <div class="new-presu">
            <b>Nuevo presupuesto</b>
            <input id="input-nombre-obra" class="input" type="text" placeholder="Nombre de la obra">
            <button class="btn btn-dark" onclick="confirmarNombreObra()">Empezar medición</button>
        </div>
    </div>

    <!-- Obra en curso -->
    <div id="pantalla-trabajo" class="hidden screen screen-pad" style="padding-bottom:120px">
        <div class="work-head">
            <div>
                <h2 id="titulo-obra-actual" class="work-title"></h2>
                <input type="date" id="fecha-obra" class="work-date">
                <div id="aviso-edicion" class="work-edit"></div>
            </div>
            <div class="work-actions">
                <button class="btn-pdf" onclick="guardarObraCompleta()">PDF</button>
                <button class="icon-btn" aria-label="Cerrar" onclick="irAPantalla('clientes')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>
        <div class="seg" role="group" aria-label="IVA">
            <button id="btn-iva-21" class="iva-btn on" onclick="cambiarIVA(21)">IVA 21%</button>
            <button id="btn-iva-10" class="iva-btn" onclick="cambiarIVA(10)">IVA 10%</button>
            <button id="btn-iva-0" class="iva-btn" onclick="cambiarIVA(0)">Sin IVA</button>
        </div>
        <div id="lista-medidas-obra"></div>
        <div id="botones-trabajo" class="tiles"></div>
    </div>

    <!-- Calculadora -->
    <div id="modal-calc" class="hidden calc">
        <div class="ruler" aria-hidden="true"></div>
        <div class="calc-top">
            <p id="calc-titulo" class="calc-title">Medida</p>
            <div id="calc-display" class="calc-display">0</div>
        </div>
        <div class="keys">
            <button class="key" onclick="teclear('7')">7</button>
            <button class="key" onclick="teclear('8')">8</button>
            <button class="key" onclick="teclear('9')">9</button>
            <button class="key del" onclick="teclear('DEL')" aria-label="Borrar">C</button>
            <button class="key" onclick="teclear('4')">4</button>
            <button class="key" onclick="teclear('5')">5</button>
            <button class="key" onclick="teclear('6')">6</button>
            <button class="key op" onclick="teclear('+')" aria-label="Sumar tramo">+</button>
            <button class="key" onclick="teclear('1')">1</button>
            <button class="key" onclick="teclear('2')">2</button>
            <button class="key" onclick="teclear('3')">3</button>
            <button class="key exit" onclick="cerrarCalc()">Salir</button>
            <button class="key" onclick="teclear('0')">0</button>
            <button class="key" onclick="teclear('.')">,</button>
            <button class="key ok" onclick="teclear('OK')">OK</button>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
